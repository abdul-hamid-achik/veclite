version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: veclite
    main: ./cmd/veclite
    binary: veclite
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}

archives:
  - id: veclite
    ids:
      - veclite
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: abdul-hamid-achik
    name: veclite
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

homebrew_casks:
  - name: veclite
    ids:
      - veclite
    repository:
      owner: abdul-hamid-achik
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/abdul-hamid-achik/veclite"
    description: "SQLite for vectors. Embed anywhere, no servers, one file"
    license: "MIT"
    binaries:
      - veclite
    caveats: "The veclite binary is not Apple-notarized; this cask clears its quarantine attribute during installation."
    # Released binaries are unsigned (pure-Go, CGO_ENABLED=0, not notarized),
    # so strip the Gatekeeper quarantine attribute on install — otherwise macOS
    # refuses to run a cask-installed unsigned binary.
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/veclite"] if OS.mac?
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"
