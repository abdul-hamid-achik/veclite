<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VecLite — Embeddable Vector Database for Go">
  <title>VecLite — Embeddable Vector Database for Go</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0817"/>
      <stop offset="0.5" stop-color="#110B22"/>
      <stop offset="1" stop-color="#0B0817"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="500" y1="180" x2="1100" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="35%">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo tile (left) -->
  <g transform="translate(80, 187)">
    <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#logo-grad)"/>
    <!-- one record fanning into named vector spaces -->
    <g stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.95">
      <line x1="118" y1="150" x2="70" y2="74"/>
      <line x1="118" y1="150" x2="192" y2="86"/>
      <line x1="118" y1="150" x2="186" y2="196"/>
    </g>
    <circle cx="70" cy="74" r="15" fill="#FFFFFF"/>
    <circle cx="192" cy="86" r="13" fill="#E9D5FF"/>
    <circle cx="186" cy="196" r="13" fill="#C7D2FE"/>
    <circle cx="118" cy="150" r="18" fill="#FFFFFF"/>
    <circle cx="118" cy="150" r="8" fill="#7C3AED"/>
  </g>

  <!-- Text (right) -->
  <text x="400" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#F5F3FF" letter-spacing="-3">
    Vec<tspan fill="url(#text-grad)">Lite</tspan>
  </text>
  <text x="400" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#C4B5FD" letter-spacing="-1">
    Embeddable vector database for Go
  </text>
  <text x="400" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#8B85A8">
    HNSW  ·  BM25  ·  Hybrid Search  ·  Named Vector Spaces
  </text>
  <text x="400" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#8B85A8">
    Single-File  ·  Agent Memory  ·  CLI  ·  HTTP  ·  MCP
  </text>

  <!-- Install command pill -->
  <rect x="400" y="450" width="520" height="52" rx="26" fill="#16122A" stroke="#2D2654" stroke-width="1.5"/>
  <text x="424" y="484" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="500" fill="#C4B5FD">
    go get github.com/abdul-hamid-achik/veclite
  </text>

  <!-- Version tag -->
  <rect x="400" y="530" width="120" height="32" rx="16" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.25)" stroke-width="1"/>
  <text x="460" y="551" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#A855F7" text-anchor="middle">
    v0.24.0
  </text>
  <text x="535" y="551" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#8B85A8">
    MIT License
  </text>
</svg>