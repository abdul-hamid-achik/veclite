name: Docs

# Repo-defined hosted documentation deployment to GitHub Pages.
#
# This builds the VitePress site with Bun and publishes it to GitHub Pages.
# It is the repository's own hosted deployment; the root-served Vercel deploy
# (vercel.json) remains available and is account-linked. Pages serves from the
# project subpath, so the build sets DOCS_BASE=/veclite/ (see docs/.vitepress/config.mts).
#
# Enable once under repo Settings → Pages → "Build and deployment" → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run site
        env:
          DOCS_BASE: /veclite/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
